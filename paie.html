<script type="module">
  import { requireAuth, currentUser } from "./js/auth-guard.js";
  import { db, collection, onSnapshot } from "./js/firebase-init.js";

  const STAFF_ROLES = ['admin', 'lead', 'co-lead', 'colead'];

  // Coût en objets/matériel consommé par action, déduit du salaire.
  // À compléter au fur et à mesure (les items non listés ici coûtent 0).
  const ITEM_COST = {
    "ATM": 350,
    "Cambu": 150,
    "Fleeca": 7000,
  };

  // Calcule le coût matériel d'une action précise :
  // - Branche : 10800$ fixe, peu importe le nombre de branches
  // - Ventes  : prix d'achat unitaire renseigné x quantité vendue
  // - le reste : coût fixe défini dans ITEM_COST (0 si non renseigné)
  // Si l'action a été partagée entre coéquipiers (Fleeca, plantation), le
  // coût est déjà divisé par le nombre de participants (splitCount).
  function materialCostOf(a) {
    let raw;
    if (a.item === 'Branche') {
      raw = 10800;
    } else if (a.category === 'Ventes') {
      raw = Number(a.buyPrice || 0) * Number(a.quantity || 1);
    } else {
      raw = ITEM_COST[a.item] || 0;
    }
    return raw / Number(a.splitCount || 1);
  }

  // Part du "sale" (brut) qui devient du "propre" (net), avant déduction du matériel.
  const NET_RATE = 0.7;

  const CATEGORY_LABELS = {
    Ventes: "Ventes",
    Braquage: "Braquages",
    Actions: "Actions",
    Four: "Ventes du Four",
  };

  function money(n) {
    return '$' + Number(n || 0).toLocaleString('fr-FR');
  }

  // Renvoie le dimanche 19h le plus récent (même logique que Comptabilité / Récap).
  function getWeekStart(now = new Date()) {
    const d = new Date(now);
    const candidate = new Date(d);
    candidate.setDate(d.getDate() - d.getDay());
    candidate.setHours(19, 0, 0, 0);
    if (candidate > d) candidate.setDate(candidate.getDate() - 7);
    return candidate;
  }

  requireAuth().then(() => {
    const role = (currentUser.role || '').toLowerCase();
    if (!STAFF_ROLES.includes(role)) {
      alert("Accès réservé au staff (Admin, Lead, Co-Lead).");
      window.location.href = 'dashboard.html';
      return;
    }

    const container = document.getElementById('payrollList');
    let users = [];
    let actions = [];

    function render() {
      if (users.length === 0) {
        container.innerHTML = '<p style="color:var(--text-2);">Aucun membre pour l\'instant.</p>';
        return;
      }

      const weekStart = getWeekStart().getTime();
      const weekActions = actions.filter(a => {
        const ts = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
        return ts >= weekStart;
      });

      container.innerHTML = users.map(u => {
        const mine = weekActions.filter(a => a.username === u.username);

        const isClean = a => a.pool === 'clean';

        const brut = mine.reduce((s, a) => s + Number(a.amount || 0), 0);
        const materielSale = mine.filter(a => !isClean(a)).reduce((s, a) => s + materialCostOf(a), 0);
        const materielPropre = mine.filter(isClean).reduce((s, a) => s + materialCostOf(a), 0);

        // Paie = 70% du (brut - matériel sale), puis on retire le matériel propre.
        const paie = ((brut - materielSale) * NET_RATE) - materielPropre;

        // Regroupe le détail par catégorie puis par item.
        const grouped = {};
        mine.forEach(a => {
          const cat = a.category || 'Autre';
          const item = a.item || '—';
          grouped[cat] = grouped[cat] || {};
          grouped[cat][item] = grouped[cat][item] || { count: 0, amount: 0, material: 0 };
          grouped[cat][item].count += 1;
          grouped[cat][item].amount += Number(a.amount || 0);
          grouped[cat][item].material += materialCostOf(a);
        });

        const detailHtml = Object.keys(grouped).length === 0
          ? '<p style="color:var(--text-2); font-size:13px; margin:8px 0 0;">Aucune action cette semaine.</p>'
          : Object.keys(grouped).map(cat => {
              const items = grouped[cat];
              const rows = Object.keys(items).map(item => `
                <tr>
                  <td>${item}</td>
                  <td>${items[item].count}</td>
                  <td>${money(items[item].amount)}</td>
                  <td>${money(items[item].material)}</td>
                </tr>
              `).join('');
              return `
                <p style="color:var(--text-2); font-size:12px; font-weight:700; text-transform:uppercase; margin:14px 0 4px;">${CATEGORY_LABELS[cat] || cat}</p>
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>Détail</th><th>Nombre</th><th>Argent rapporté</th><th>Matériel déduit</th></tr></thead>
                    <tbody>${rows}</tbody>
                  </table>
                </div>
              `;
            }).join('');

        return `
          <div class="card" style="margin-bottom:20px;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
              <span class="avatar">${u.username.slice(0, 2).toUpperCase()}</span>
              <h3 style="margin:0;">${u.username}</h3>
            </div>

            <div class="stat-grid" style="grid-template-columns: repeat(2, 1fr); margin-top:14px; margin-bottom:16px;">
              <div class="stat-tile">
                <div class="label">Brut</div>
                <div class="value" style="font-size:20px;">${money(brut)}</div>
                <div class="sub">Toutes actions confondues</div>
              </div>
              <div class="stat-tile">
                <div class="label">Paie (net final)</div>
                <div class="value" style="font-size:20px; color:${paie >= 0 ? 'var(--green)' : 'var(--red)'};">${money(paie)}</div>
                <div class="sub">70% × (brut − matériel sale) − matériel propre</div>
              </div>
            </div>

            <div class="stat-grid" style="grid-template-columns: repeat(2, 1fr);">
              <div class="stat-tile">
                <div class="label">Matériel sale déduit</div>
                <div class="value" style="font-size:20px; color:var(--red);">${money(materielSale)}</div>
                <div class="sub">Déduit avant les 70%</div>
              </div>
              <div class="stat-tile">
                <div class="label">Matériel propre déduit</div>
                <div class="value" style="font-size:20px; color:var(--red);">${money(materielPropre)}</div>
                <div class="sub">Déduit après les 70%</div>
              </div>
            </div>

            ${detailHtml}
          </div>
        `;
      }).join('');
    }

    onSnapshot(collection(db, 'users'), (snap) => {
      users = snap.docs.map(d => d.data());
      render();
    });
    onSnapshot(collection(db, 'actions'), (snap) => {
      actions = snap.docs.map(d => d.data());
      render();
    });
  });
</script>
