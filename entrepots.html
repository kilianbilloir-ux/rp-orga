    <main class="page">

      </div>

          <p style="color:var(--text-2);">Chargement...</p>

<script type="module">
  import { requireAuth } from "./js/auth-guard.js";
  import { db, collection, query, orderBy, limit, onSnapshot } from "./js/firebase-init.js";

  requireAuth().then(() => {
    const container = document.getElementById('entrepotsList');

    const q = query(collection(db, 'entrepots'), orderBy('receivedAt', 'desc'), limit(100));
    onSnapshot(q, (snap) => {
      if (snap.empty) {
        container.innerHTML = '<p style="color:var(--text-2);">Rien reçu pour l\'instant. Une fois le webhook configuré côté jeu, les prises/dépôts apparaîtront ici automatiquement.</p>';
        return;
      }

      container.innerHTML = snap.docs.map(d => {
        const e = d.data();
        const date = e.receivedAt?.toDate ? e.receivedAt.toDate().toLocaleString('fr-FR') : '—';
        const badge = e.action === 'pris'
          ? '<span class="badge" style="background:rgba(239,68,68,0.12); color:var(--red);">Pris</span>'
          : e.action === 'pose'
            ? '<span class="badge">Posé</span>'
            : '<span class="badge staff">Inconnu</span>';
        const text = e.text ? e.text.slice(0, 300) : '(pas de texte lisible)';
        return `
          <div style="padding:12px 4px; border-bottom:1px solid var(--border);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              ${badge}
              <span style="color:var(--text-3); font-size:12px;">${date}</span>
            </div>
            <div style="color:var(--text-1); font-size:13.5px;">${text}</div>
            <details style="margin-top:6px;">
              <summary style="color:var(--text-3); font-size:11px; cursor:pointer;">Voir les données brutes</summary>
              <pre style="white-space:pre-wrap; word-break:break-all; color:var(--text-2); font-size:11px; background:var(--bg-1); padding:8px; border-radius:6px; margin-top:6px;">${JSON.stringify(e.raw, null, 2)}</pre>
            </details>
          </div>
        `;
      }).join('');
    });
  });
</script>
